spring:
  application:
    name: api_key1
  datasource:
    # En tu laptop usa XAMPP; en Render usa las variables DB_URL, DB_USER y DB_PASSWORD
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_techservices?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

server:
  port: ${PORT:8085}
